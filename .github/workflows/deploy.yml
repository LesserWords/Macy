name: deploy

# Staging deploy on merge to main (ADR-019, F20 AC2).
# Production deploy on `v*` tags (ADR-019, F20 AC3, M5-01).
#
# Staging activates when repository variable STAGING_DEPLOY_ENABLED is "true".
# Production activates when repository variable PROD_DEPLOY_ENABLED is "true".
# Required environment secrets (`staging` / `production`):
#   *_SSH_HOST, *_SSH_USER, *_SSH_KEY, *_SSH_KNOWN_HOSTS (`ssh-keyscan -t ed25519 <host>`)
# Optional variables:
#   *_SSH_PORT, *_APP_URL, plus secret PROD_PLAYWRIGHT_STORAGE_STATE / PLAYWRIGHT_STORAGE_STATE.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target environment"
        type: choice
        default: staging
        options:
          - staging
          - production
      tag:
        description: "Image tag to deploy (optional override for manual production dispatch)"
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    deploy-${{
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
      && 'prod' || 'staging'
    }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'production')
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      REMOTE_DIR: /opt/macy/staging
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH (pinned host key, no trust-on-first-use)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host staging
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Ship release bundle
        run: |
          tar czf bundle.tgz infra/compose.yaml infra/compose.prod.yaml infra/Caddyfile db scripts/deploy.sh scripts/backup.sh infra/deploy
          ssh staging "mkdir -p '$REMOTE_DIR'"
          ssh staging "tar xzf - -C '$REMOTE_DIR'" < bundle.tgz

      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Short-lived token goes over stdin; no long-lived registry credential lives on the VPS.
          printf '%s' "$REGISTRY_TOKEN" |
            ssh staging "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh staging "cd '$REMOTE_DIR' && APP_IMAGE='$IMAGE' APP_TAG='$TAG' sh scripts/deploy.sh"

      - name: Log out GHCR on staging host
        if: always()
        run: ssh staging "docker logout ghcr.io" || true

  build-prod:
    if: >-
      vars.PROD_DEPLOY_ENABLED == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute production image name and release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          elif ! printf '%s' "$GITHUB_REF" | grep -q '^refs/tags/v'; then
            RELEASE_TAG="${GITHUB_SHA}"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: build-prod
    if: >-
      vars.PROD_DEPLOY_ENABLED == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
      REMOTE_DIR: /opt/macy/prod
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH (pinned host key, no trust-on-first-use)
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy_prod
          chmod 600 ~/.ssh/id_deploy_prod
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/id_deploy_prod
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Record previous deployed tag
        id: prev
        run: |
          prev_tag="$(ssh prod "cd '$REMOTE_DIR' 2>/dev/null && \
            cid=\$(docker compose -p macy-prod --env-file .env -f infra/compose.yaml -f infra/compose.prod.yaml ps -q app 2>/dev/null | head -n 1 || true); \
            if [ -n \"\$cid\" ]; then docker inspect -f '{{.Config.Image}}' \"\$cid\" | awk -F: '{print \$NF}'; fi" 2>/dev/null || true)"
          echo "tag=${prev_tag}" >> "$GITHUB_OUTPUT"

      - name: Ship release bundle
        run: |
          tar czf bundle.tgz infra/compose.yaml infra/compose.prod.yaml infra/Caddyfile db scripts/deploy.sh scripts/backup.sh infra/deploy
          ssh prod "mkdir -p '$REMOTE_DIR'"
          ssh prod "tar xzf - -C '$REMOTE_DIR'" < bundle.tgz

      - name: Deploy production stack
        env:
          IMAGE: ${{ needs.build-prod.outputs.image }}
          TAG: ${{ needs.build-prod.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            ssh prod "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh prod "cd '$REMOTE_DIR' && APP_IMAGE='$IMAGE' APP_TAG='$TAG' sh scripts/deploy.sh"

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Install Playwright Chromium for post-deploy smoke test
        run: uv run playwright install --with-deps chromium

      - name: Run post-deploy smoke test (J1 read-only + health)
        env:
          PROD_APP_URL: ${{ vars.PROD_APP_URL || secrets.PROD_APP_URL }}
          PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PROD_PLAYWRIGHT_STORAGE_STATE || secrets.PLAYWRIGHT_STORAGE_STATE }}
          MCP_ENABLED: ${{ vars.MCP_ENABLED }}
          MCP_AUTH_TOKEN: ${{ secrets.PROD_MCP_AUTH_TOKEN || secrets.MCP_AUTH_TOKEN }}
        run: |
          if [ -z "$PROD_APP_URL" ]; then
            echo "PROD_APP_URL must be configured in the production environment" >&2
            exit 1
          fi
          smoke_args="--url $PROD_APP_URL"
          if [ -n "$PLAYWRIGHT_STORAGE_STATE" ]; then
            smoke_args="$smoke_args --require-auth"
          fi
          if [ "$MCP_ENABLED" = "true" ]; then
            smoke_args="$smoke_args --check-mcp"
          fi
          # shellcheck disable=SC2086
          uv run python scripts/post_deploy_smoke.py $smoke_args

      - name: Roll back to previous tag on post-deploy smoke failure
        if: failure() && steps.prev.outputs.tag != '' && steps.prev.outputs.tag != needs.build-prod.outputs.tag
        env:
          IMAGE: ${{ needs.build-prod.outputs.image }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            ssh prod "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh prod "cd '$REMOTE_DIR' && APP_IMAGE='$IMAGE' APP_TAG='$PREV_TAG' sh scripts/deploy.sh"

      - name: Log out GHCR on production host
        if: always()
        run: ssh prod "docker logout ghcr.io" || true
