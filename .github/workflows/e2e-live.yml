name: Live E2E (Nightly)

'on':
  schedule:
    # 03:00 UTC nightly (ADR-018, M2-07)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging target URL'
        required: false
        default: 'https://staging.macy.example.com'

concurrency:
  group: e2e-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-live:
    name: Live E2E J0–J8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check staging availability
        id: check_staging
        run: |
          if [ "${{ vars.LIVE_E2E_ENABLED }}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "LIVE_E2E_ENABLED repository variable is not set to 'true'. Skipping nightly run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium
        if: steps.check_staging.outputs.skip != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Run Live E2E tests (J0–J8)
        if: steps.check_staging.outputs.skip != 'true'
        env:
          STAGING_APP_URL: ${{ inputs.staging_url || vars.STAGING_APP_URL || 'https://staging.macy.example.com' }}
          PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE }}
          APP_ENV: staging
          REQUIRE_LIVE_SERVER: 'true'
        run: |
          mkdir -p artifacts/playwright-results
          uv run pytest tests/test_live_e2e_j0_j4.py \
            -m live_e2e \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --reruns 1 \
            --output artifacts/playwright-results

      - name: Run Live E2E MCP check
        if: steps.check_staging.outputs.skip != 'true'
        env:
          STAGING_APP_URL: ${{ inputs.staging_url || vars.STAGING_APP_URL || 'https://staging.macy.example.com' }}
          MCP_ENABLED: ${{ vars.MCP_ENABLED }}
          MCP_AUTH_TOKEN: ${{ secrets.STAGING_MCP_AUTH_TOKEN || secrets.MCP_AUTH_TOKEN }}
          APP_ENV: staging
          REQUIRE_LIVE_SERVER: 'true'
        run: |
          if [ -n "$MCP_AUTH_TOKEN" ] || [ "$MCP_ENABLED" = "true" ]; then
            REQUIRE_LIVE_MCP='true' uv run pytest tests/test_live_e2e_mcp.py -m live_e2e --no-cov
          else
            echo "MCP live check skipped: MCP_AUTH_TOKEN not set and MCP_ENABLED != 'true'."
          fi

      - name: Upload Playwright test results, traces, and screenshots
        if: always() && steps.check_staging.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: artifacts/playwright-results/
          if-no-files-found: ignore
