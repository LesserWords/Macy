sources:
  - {name: "Google Search Central", domain: "developers.google.com", url: "https://developers.google.com/search", fetch_mode: "site_search", tier: 1, role: "news", locales: ["en-US"], topics: ["seo", "structured-data", "search-updates"], enabled: true, notes: "Official search, crawlability, and structured data documentation."}
  - {name: "Schema.org", domain: "schema.org", url: "https://schema.org", fetch_mode: "site_search", tier: 1, role: "data", locales: ["en-US"], topics: ["json-ld", "structured-data", "entities"], enabled: true, notes: "Canonical vocabulary specification for machine-readable web schemas."}
  - {name: "W3C", domain: "w3.org", url: "https://www.w3.org", fetch_mode: "feed", feed_url: "https://www.w3.org/blog/feed/", tier: 1, role: "data", locales: ["en-US"], topics: ["web-standards", "accessibility", "wcag"], enabled: true, notes: "Web accessibility, HTML semantics, and open web standards."}
  - {name: "IETF", domain: "ietf.org", url: "https://www.ietf.org", fetch_mode: "site_search", tier: 2, role: "data", locales: ["en-US"], topics: ["http", "security", "protocols"], enabled: true, notes: "Internet engineering standards and protocol specifications."}
  - {name: "MDN Web Docs", domain: "developer.mozilla.org", url: "https://developer.mozilla.org", fetch_mode: "site_search", tier: 1, role: "management", locales: ["en-US"], topics: ["web-platform", "performance", "semantics"], enabled: true, notes: "Authoritative open web technical documentation and best practices."}
  - {name: "web.dev", domain: "web.dev", url: "https://web.dev", fetch_mode: "feed", feed_url: "https://web.dev/feed.xml", tier: 2, role: "news", locales: ["en-US"], topics: ["core-web-vitals", "performance", "seo"], enabled: true, notes: "Modern web performance, Core Web Vitals, and UX engineering guidance."}
  - {name: "Unicode Consortium", domain: "unicode.org", url: "https://home.unicode.org", fetch_mode: "site_search", tier: 2, role: "company", locales: ["en-US"], topics: ["i18n", "localization", "standards"], enabled: true, notes: "Internationalization and text encoding standards organization."}
  - {name: "RFC Editor", domain: "rfc-editor.org", url: "https://www.rfc-editor.org", fetch_mode: "site_search", tier: 3, role: "company", locales: ["en-US"], topics: ["standards", "internet-architecture"], enabled: true, notes: "Archival series of technical and organizational internet specifications."}
  - {name: "Legacy Standards Archive", domain: "legacy-standards.example.org", url: "https://legacy-standards.example.org", fetch_mode: "feed", feed_url: "https://legacy-standards.example.org/feed.xml", tier: 3, role: "news", locales: ["en-US"], topics: ["archived"], enabled: false, notes: "Archived placeholder feed kept disabled by default."}
