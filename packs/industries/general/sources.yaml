  - {name: "Portal Gov.br", domain: "gov.br", url: "https://www.gov.br", fetch_mode: "site_search", tier: 2, role: "news", locales: ["pt-BR"], topics: ["regulacao", "servicos-digitais", "conformidade"], enabled: true, notes: "Comunicados oficiais, normas e diretrizes regulatórias no Brasil."}
