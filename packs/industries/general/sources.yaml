  - {name: "IBGE", domain: "ibge.gov.br", url: "https://www.ibge.gov.br", fetch_mode: "site_search", tier: 1, role: "data", locales: ["pt-BR"], topics: ["economia", "varejo", "servicos"], enabled: true, notes: "Pesquisas econômicas e estatísticas oficiais de mercado no Brasil."}
  - {name: "IPEA", domain: "ipea.gov.br", url: "https://www.ipea.gov.br", fetch_mode: "site_search", tier: 1, role: "data", locales: ["pt-BR"], topics: ["economia", "produtividade", "mercado"], enabled: true, notes: "Estudos econômicos e indicadores setoriais aplicados no Brasil."}
  - {name: "Banco Central do Brasil", domain: "bcb.gov.br", url: "https://www.bcb.gov.br", fetch_mode: "site_search", tier: 1, role: "data", locales: ["pt-BR"], topics: ["pagamentos", "pix", "credito"], enabled: true, notes: "Dados oficiais sobre sistema financeiro, crédito e meios de pagamento."}
