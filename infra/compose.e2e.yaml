# Offline E2E test stack (ADR-012, ADR-018)
services:
  db:
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-55432}:5432"

  app:
    environment:
      ENVIRONMENT: test
      APP_ENV: test
      DATABASE_URL: postgres://app:app_secret@db:5432/${POSTGRES_DB:-macy}?sslmode=disable
      FAKE_OIDC_ENABLED: "true"
      FAKE_OIDC_URL: http://fake-oidc:8080

  worker:
    environment:
      ENVIRONMENT: test
      APP_ENV: test
      DATABASE_URL: postgres://app:app_secret@db:5432/${POSTGRES_DB:-macy}?sslmode=disable

  mcp:
    environment:
      ENVIRONMENT: test
      APP_ENV: test
      DATABASE_URL: postgres://app:app_secret@db:5432/${POSTGRES_DB:-macy}?sslmode=disable
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-e2e-test-mcp-bearer-token-32chars}
      MCP_ACTOR_EMAIL: ${MCP_ACTOR_EMAIL:-owner@example.test}
      SAFE_HTTP_TEST_ALLOW_HOSTS: webhook-receiver
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:8765:8765"

  webhook-receiver:
    image: python:3.12-slim-bookworm
    command:
      - python
      - -c
      - |
        import json, threading
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        LOCK = threading.Lock()
        RECEIVED = []
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == '/requests':
                    with LOCK:
                        body = json.dumps({'requests': list(RECEIVED)}).encode()
                else:
                    body = b'{"status":"ok"}'
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def do_POST(self):
                length = int(self.headers.get('Content-Length', '0'))
                raw = self.rfile.read(length).decode('utf-8', errors='replace')
                try:
                    parsed = json.loads(raw) if raw else {}
                except Exception:
                    parsed = {'raw': raw}
                with LOCK:
                    RECEIVED.append({'path': self.path, 'headers': {k.lower(): v for k, v in self.headers.items()}, 'body': parsed, 'raw': raw})
                draft = parsed.get('draft') if isinstance(parsed, dict) else {}
                slug = draft.get('slug', 'e2e-post') if isinstance(draft, dict) else 'e2e-post'
                did = parsed.get('draft_id', 'e2e') if isinstance(parsed, dict) else 'e2e'
                mode = parsed.get('mode', 'draft') if isinstance(parsed, dict) else 'draft'
                resp = json.dumps({'schema_version': 1, 'destination': 'http_webhook', 'external_id': f'e2e-{did}', 'url': f'https://cms.example.com/posts/{slug}', 'status': 'published', 'raw': {'mode': mode}}).encode()
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(resp)))
                self.end_headers()
                self.wfile.write(resp)
            def log_message(self, format, *args):
                pass
        ThreadingHTTPServer(('0.0.0.0', 9000), Handler).serve_forever()
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000')"]
      interval: 5s
      timeout: 3s
      retries: 3

  fake-oidc:
    image: python:3.12-slim-bookworm
    command:
      - python
      - -c
      - |
        from http.server import HTTPServer, BaseHTTPRequestHandler
        import json
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({'sub': 'test-user', 'email': 'test@example.com'}).encode())
            def log_message(self, format, *args):
                pass
        HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 5s
      timeout: 3s
      retries: 3
