# Production / Staging stack overlay (ADR-012)
#
# Used for both VPS projects (`-p macy-staging`, later `-p macy-prod`):
#   docker compose -p macy-staging --env-file .env -f infra/compose.yaml -f infra/compose.prod.yaml ...
# Never combine with infra/compose.override.yaml: that file publishes the database port.
# Required secrets use `${VAR:?}` so a render fails fast instead of falling back to
# the development defaults in compose.yaml.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:?set APP_ENV in the env file}
  ENVIRONMENT: ${APP_ENV:-staging}
  DATABASE_URL: postgres://app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-macy}?sslmode=disable
  RETENTION_DATABASE_URL: postgres://retention:${RETENTION_DB_PASSWORD:-retention_secret}@db:5432/${POSTGRES_DB:-macy}?sslmode=disable
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  HEARTBEAT_URL: ${HEARTBEAT_URL:-}
  APP_TAG: ${APP_TAG:-}

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  migrate:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-owner}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-macy}?sslmode=disable

  app:
    build: !reset null
    pull_policy: missing
    environment:
      <<: *app-env
      DOMAIN: ${DOMAIN:?set DOMAIN}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:?set AUTH_COOKIE_SECRET}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      GOOGLE_SERVER_METADATA_URL: ${GOOGLE_SERVER_METADATA_URL:-https://accounts.google.com/.well-known/openid-configuration}

  worker:
    build: !reset null
    pull_policy: missing
    environment:
      <<: *app-env

  mcp:
    build: !reset null
    pull_policy: missing
    environment:
      <<: *app-env
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ACTOR_EMAIL: ${MCP_ACTOR_EMAIL:-}

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-macy}
      POSTGRES_USER: ${POSTGRES_USER:-owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      OFFSITE_BACKUP_DIR: /offsite
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      OFFSITE_SYNC_CMD: ${OFFSITE_SYNC_CMD:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_ALERT_URL: ${BACKUP_ALERT_URL:-}
    volumes:
      - ../scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
      - ${OFFSITE_BACKUP_PATH:-../backups/offsite}:/offsite
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U $${POSTGRES_USER} -d $${POSTGRES_DB} && test -f /backups/.last_backup_ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:
  backup_data:
